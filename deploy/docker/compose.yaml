# FleetHub hub under Docker Compose. Works on Docker Engine (Linux) and Docker Desktop.
#
#   docker compose -f deploy/docker/compose.yaml up -d
#
# Updating is pull + recreate -- the hub never updates itself inside a container (see
# hub/Dockerfile):
#
#   docker compose -f deploy/docker/compose.yaml pull
#   docker compose -f deploy/docker/compose.yaml up -d
#
# Pin HUB_TAG to a version (HUB_TAG=1.143.0) to choose when a release goes in;
# "stable-latest" follows main, "beta-latest" follows the beta branch, and "latest" is the
# newest of the two -- which is usually beta, so it is not the default. Deploy order is
# unchanged: hub first, agent releases after.
name: fleethub

services:
  hub:
    # Was ghcr.io/aw08-2004/temp_monitor-hub until 2026-10-27. That name gets no new tags
    # since 2026-10-29, so a host still on it never updates again until it moves to this one.
    image: ghcr.io/aw08-2004/fleethub:${HUB_TAG:-stable-latest}
    container_name: fleethub-hub
    # Exactly one replica, ever: the schedulers, db_writer and Socket.IO state are in-process.
    restart: unless-stopped
    # Bootstrap config from the host: `cp example.env .env` next to this file, then edit. The
    # path resolves relative to this file, and the same .env feeds compose's own ${HUB_TAG}.
    # Required on purpose -- a hub with no FLASK_SECRET_KEY refuses to start anyway, so a
    # missing file is better caught here than in a crash loop.
    #
    # **Keep console-managed keys out of it.** The hub still reads /state/.env, but
    # load_dotenv never overrides a variable already set, so anything injected here shadows
    # what the Settings pages write there: the save looks applied, then reverts on the next
    # recreate. example.env lists the keys that belong to the volume.
    env_file:
      - .env
    volumes:
      # A named volume rather than a bind mount by default: SQLite on a Docker Desktop bind
      # mount (Windows or macOS host paths) is slow and its file locking is not reliable.
      # On a Linux host a bind mount is fine -- e.g. `- /srv/fleethub:/state`, owned by uid
      # 10001.
      - fleethub-state:/state
    ports:
      # Loopback only: the public TLS is terminated in front of the hub (Cloudflare tunnel,
      # nginx), and ProxyFix trusts exactly one hop. Publish on 0.0.0.0 only if that proxy is
      # on another host.
      #
      # The port follows FLEETHUB_PORT from .env. example.env sets 29443 with FLEETHUB_TLS=1
      # (the hub then serves HTTPS to the proxy too, hub 1.170.0+); a .env written before that
      # has neither key, so it falls back to 3001 and plain HTTP -- the image's own default --
      # and an existing deployment is not moved by pulling this file.
      - "127.0.0.1:${FLEETHUB_PORT:-3001}:${FLEETHUB_PORT:-3001}"
    # Uncomment on a LINUX host (and drop `ports:`) if the hub must send Wake-on-LAN packets
    # itself. On the default bridge network the hub is never on a target's subnet, so only
    # the agent-relayed wake works -- which is the primary path anyway. Docker Desktop's
    # host networking is not the physical LAN and does not help.
    # network_mode: host
    stop_grace_period: 30s

volumes:
  fleethub-state:
