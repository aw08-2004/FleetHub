name: "Hub image"

# Builds the hub's container image (hub/Dockerfile) and publishes it to GHCR. A container hub
# never updates itself -- HUB_UPDATE_MODE=image -- so this workflow IS the hub's release path
# for every hub that runs under Docker: a push to main that bumps HUB_VERSION becomes a tag an
# operator can `docker compose pull`.
#
#   main -> ghcr.io/<owner>/fleethub:X.Y.Z  and :latest
#   beta -> ghcr.io/<owner>/fleethub:beta-X.Y.Z  and :beta
#
# **Every tag is also pushed to the old name, ghcr.io/<owner>/temp_monitor-hub.** The package
# was published under the pre-rename name from 1.143.0 to 1.168.0 (renamed 2026-10-27), and
# every host started from the compose file of that time pulls it. Publishing only to the new
# name would leave those hosts reading "no new tag" forever -- the same silent nothing-happens
# as a reused HUB_VERSION. GHCR cannot rename or redirect a package, so the mirror stays until
# ROADMAP.MD says every Docker host has moved to the new image line in compose.yaml. The
# "already published" check covers both names, so the two can never carry different images
# under one tag; re-running a push that failed between the names copies the image it already
# published rather than rebuilding (see that step).
#
# Beta gets its own prefix rather than sharing X.Y.Z, because promoting beta to main carries
# the same HUB_VERSION across -- a shared tag would make main's build collide with beta's.
#
# **It refuses a version tag that already exists.** Every updater in this project asks "is the
# other side strictly newer", so a reused HUB_VERSION is a release that silently reaches
# nobody (VERSIONING.md; it has bitten twice). Overwriting the tag would be worse: two
# different images under one version. Pull requests only build, to catch a broken
# Dockerfile, a stale requirements.lock or a hub/ entry the Dockerfile does not copy before
# it reaches a branch that publishes -- beta included, since every change lands there first.
#
# **Plain docker and curl, no third-party actions.** A job holding `packages: write` should not
# run code from tags someone else can move, and the docker/* actions bought nothing here that
# `docker build` and `docker push` do not do. Dropping setup-buildx also drops its pull of
# moby/buildkit from Docker Hub before every build, which is what failed this workflow's first
# run. Inputs reach the scripts through env, never by `${{ }}` pasted into shell.
#
# The packages are meant to be PUBLIC, like this repository, so a hub host pulls without a
# login. GitHub creates every new package private, and visibility cannot be set from a workflow
# (there is no API for it). The first publish under a new name is therefore followed by a
# one-time, one-way switch in that package's settings: Danger Zone -> Change visibility ->
# Public. temp_monitor-hub has had it; fleethub is owed it, in ROADMAP.MD.

# A push publishes, so it triggers only on hub/**: every hub/ change carries a HUB_VERSION
# bump, and anything else has nothing to release. A push touching only this file or the lock
# tool used to run the "already published" check against the unchanged version and go red
# asking for a bump that would ship a no-op release to every hub (PR review). Pull requests
# still trigger on all three, so a change to the workflow or the checker is built and checked
# before it merges.
on:
  push:
    branches: [main, beta]
    paths:
      - "hub/**"
  pull_request:
    branches: [main, beta]
    paths:
      - "hub/**"
      - "tools/lock_hub_requirements.py"
      - ".github/workflows/hub-image.yml"

concurrency:
  group: hub-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read HUB_VERSION
        id: version
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref_name }}
        run: |
          # The same pattern as app.parse_hub_version, so this reads exactly what the hubs
          # compare -- and then the stricter rule from CLAUDE.md: three numeric components.
          v=$(grep -oP '^HUB_VERSION\s*=\s*["\x27]\K[\d.]+(?=["\x27])' hub/app.py | head -n1)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::HUB_VERSION '$v' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          # The new name first: Push walks this list in order, so the name operators are told
          # to use is never the one left behind by a half-failed push.
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repos="${owner}/fleethub ${owner}/temp_monitor-hub"
          if [[ "$REF" == "beta" ]]; then
            version_tag="beta-${v}"; moving_tag="beta"
          else
            version_tag="${v}"; moving_tag="latest"
          fi
          {
            echo "version=$v"
            echo "repos=$repos"
            echo "version_tag=$version_tag"
            echo "moving_tag=$moving_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse a version that was already published
        id: published
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOS: ${{ steps.version.outputs.repos }}
          TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          # Asks the registry directly and reads the HTTP status, because "could not look" must
          # not pass as "not there": the first version of this check took any failure of
          # `docker manifest inspect` for absence, so a GHCR outage or an auth hiccup let the
          # push overwrite a published tag -- the one thing this step exists to stop.
          #
          # The token asks for pull AND push, as `docker push` itself does. With pull alone GHCR
          # answers "denied" for a package that does not exist yet, which is indistinguishable
          # from a real auth failure and would block the very first publish -- which is exactly
          # what fleethub's first run is.
          #
          # **A tag under the first name is not by itself a reuse -- it may be a half-failed
          # push.** Push is not atomic: fleethub:X can land and a later push (the mirror's X, or
          # any moving tag) then fail on a GHCR 5xx. Refusing every 200 on re-run left that
          # gap for good, so old-compose hosts, or hosts tracking `latest`/`beta`, silently
          # stayed on the previous release (PR review, twice). Rebuilding is no fix either -- a
          # rebuild is not byte-identical, so the two names would carry different images under
          # one tag. So when the first name has X, the run switches to mode=mirror: no build,
          # and Push finishes the job by copying the published image by digest. **Whether that
          # is a re-run or a real reuse is decided there, by the image's revision label**: only
          # a run of the commit that built it may finish it; any other commit is refused. A tag
          # under a later name but not the first cannot come from a half-failed push (the first
          # name is pushed first) and is refused here.
          present=(); missing=()
          for REPO in $REPOS; do
            reg_token=$(curl -fsS -u "${ACTOR}:${TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:pull,push" | jq -er .token)
            echo "::add-mask::${reg_token}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -I \
              -H "Authorization: Bearer ${reg_token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${REPO}/manifests/${TAG}")
            case "$code" in
              404) echo "ghcr.io/${REPO}:${TAG} is not published yet."; missing+=("$REPO") ;;
              200) echo "ghcr.io/${REPO}:${TAG} already exists."; present+=("$REPO") ;;
              *)   echo "::error::GHCR answered HTTP ${code} for ghcr.io/${REPO}:${TAG}, so whether it already exists is unknown. Refusing to publish rather than risk overwriting it; re-run once the registry answers."
                   exit 1 ;;
            esac
          done
          first="${REPOS%% *}"
          if [[ ${#present[@]} -eq 0 ]]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
          elif [[ "${present[0]}" != "$first" ]]; then
            echo "::error::ghcr.io/*:${TAG} already exists (under: ${present[*]}). Bump HUB_VERSION in hub/app.py -- a reused number is a release no hub will install."
            exit 1
          else
            echo "::warning::${TAG} is already under ${present[*]} -- treating this as a re-run that finishes a half-failed push; Push refuses it unless this commit built that image."
            { echo "mode=mirror"; echo "present=${present[*]}"; echo "missing=${missing[*]}"; } >> "$GITHUB_OUTPUT"
          fi

      # The three build steps are skipped in mode=mirror: there is nothing to build, and a
      # build there would be the different-image-under-one-tag the mode exists to avoid.
      - name: Check requirements.lock is current
        if: steps.published.outputs.mode != 'mirror'
        # Before any image work: a lock that no longer covers requirements.txt would build an
        # image that crashes on import. Pure Python against the two files; no image needed.
        run: python3 tools/lock_hub_requirements.py --check

      - name: Pull the base image
        if: steps.published.outputs.mode != 'mirror'
        run: |
          # Pulled here, with retries, rather than by `docker build --pull`: Docker Hub's auth
          # endpoint has timed out from GitHub's runners on this workflow's own runs (504s on
          # auth.docker.io) while answering fine everywhere else. One flaky token request
          # should cost a retry, not a red build. Read from the Dockerfile so the two never
          # name different images.
          base=$(awk 'toupper($1) == "FROM" { print $2; exit }' hub/Dockerfile)
          for attempt in 1 2 3 4 5; do
            if docker pull "$base"; then exit 0; fi
            echo "::warning::pulling ${base} failed (attempt ${attempt} of 5); retrying"
            sleep $((attempt * 15))
          done
          echo "::error::could not pull ${base} from its registry after 5 attempts"
          exit 1

      - name: Build
        if: steps.published.outputs.mode != 'mirror'
        env:
          REPOS: ${{ steps.version.outputs.repos }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          MOVING_TAG: ${{ steps.version.outputs.moving_tag }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          # The source label is what links the package to this repository on GHCR, so the
          # repository's GITHUB_TOKEN can keep pushing to it after the first publish. One build,
          # tagged under every name, so the old name mirrors the same image by digest.
          tags=()
          for REPO in $REPOS; do
            tags+=(--tag "ghcr.io/${REPO}:${VERSION_TAG}" --tag "ghcr.io/${REPO}:${MOVING_TAG}")
          done
          docker build \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            "${tags[@]}" \
            hub

      - name: Push
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOS: ${{ steps.version.outputs.repos }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          MOVING_TAG: ${{ steps.version.outputs.moving_tag }}
          MODE: ${{ steps.published.outputs.mode }}
          PRESENT: ${{ steps.published.outputs.present }}
          MISSING: ${{ steps.published.outputs.missing }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # **Every version tag before any moving tag, across both names.** If a push fails,
          # `latest` or `beta` still names the previous release rather than one whose own tag
          # never landed under some name -- and the version tags are what the check step can
          # see, so a re-run knows there is something to finish.
          if [[ "$MODE" == "mirror" ]]; then
            # Finishing a half-failed push (see the check step). Every name that already has
            # the tag must carry this commit's build; a different revision means the number
            # really was reused by another commit, and copying would spread that.
            src="ghcr.io/${REPOS%% *}:${VERSION_TAG}"
            for REPO in $PRESENT; do
              docker pull "ghcr.io/${REPO}:${VERSION_TAG}"
              built=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/${REPO}:${VERSION_TAG}")
              if [[ "$built" != "$REVISION" ]]; then
                echo "::error::ghcr.io/${REPO}:${VERSION_TAG} was built from ${built}, not ${REVISION}. Bump HUB_VERSION in hub/app.py -- a reused number is a release no hub will install."
                exit 1
              fi
            done
            for REPO in $MISSING; do
              docker tag "$src" "ghcr.io/${REPO}:${VERSION_TAG}"
              docker push "ghcr.io/${REPO}:${VERSION_TAG}"
            done
            # **Moving tags only if this is still the branch's release.** A re-run of an old
            # failed run, after a newer HUB_VERSION has shipped, would otherwise drag `latest`
            # or `beta` back to the older image (PR review). The label check above only proves
            # this commit built it, not that it is still the newest. Read from the branch head
            # with the same pattern as the version step.
            git fetch --quiet --depth 1 origin "$REF"
            head=$(git show FETCH_HEAD:hub/app.py | grep -oP '^HUB_VERSION\s*=\s*["\x27]\K[\d.]+(?=["\x27])' | head -n1)
            if [[ "$head" != "$VERSION" ]]; then
              echo "::warning::${REF} is now at HUB_VERSION ${head}, not ${VERSION}; leaving :${MOVING_TAG} where it is."
              docker logout ghcr.io
              exit 0
            fi
            for REPO in $REPOS; do
              docker tag "$src" "ghcr.io/${REPO}:${MOVING_TAG}"
            done
          else
            for REPO in $REPOS; do
              docker push "ghcr.io/${REPO}:${VERSION_TAG}"
            done
          fi
          for REPO in $REPOS; do
            docker push "ghcr.io/${REPO}:${MOVING_TAG}"
          done
          docker logout ghcr.io
